<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>币安萌芽</title>
    <meta
      name="description"
      content="币安萌芽静态首页，展示 Web3 农业生态实验的品牌主视觉与核心玩法。"
    />
    <link rel="icon" type="image/webp" href="./logo/logo.webp" />
    <link rel="apple-touch-icon" href="./logo/logo.webp" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="page-bg-animation" aria-hidden="true"></div>
      <div class="toast-region" aria-live="polite" aria-atomic="true"></div>

      <header class="site-header">
        <div class="site-logo" aria-label="币安萌芽">
          <img
            class="site-logo__image js-fallback-image"
            src="image/01.webp"
            alt="币安萌芽 Logo"
            data-placeholder="assets/placeholder.svg"
            data-fallback-target=".site-logo"
          />
          <span class="site-logo__fallback">币安萌芽 <span>🌱</span></span>
        </div>

        <nav class="top-nav" aria-label="顶部导航">
          <a class="top-nav__item" href="./币安萌芽_Binance_Sprout_白皮书.pdf" target="_blank" style="text-decoration: none;">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M8 4.75h6.5L19.25 9.5V18A2.25 2.25 0 0 1 17 20.25H8A2.25 2.25 0 0 1 5.75 18V7A2.25 2.25 0 0 1 8 4.75Z" />
                <path d="M14.25 4.75V9.5h4.75" />
                <path d="M9 13h6" />
                <path d="M9 16h4.5" />
              </svg>
            </span>
            <span>生态文档</span>
          </a>

          <a class="top-nav__item" href="https://x.com/BinanceSprout" target="_blank" style="text-decoration: none;">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
              </svg>
            </span>
            <span>推特</span>
          </a>

          <button class="top-nav__item js-toast-trigger" type="button" data-toast="排行榜开发中">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M5.75 18.25V12.5" />
                <path d="M11.75 18.25V8.25" />
                <path d="M17.75 18.25V5.75" />
                <path d="M4 18.25h15.5" />
              </svg>
            </span>
            <span>排行榜</span>
          </button>

          <a class="wallet-button" href="./app.html" style="text-decoration: none;">
            <span>立即开始</span>
          </a>
        </nav>
      </header>

      <main class="hero-home">
        <div class="hero-stage">
          <div class="scene-decor scene-decor--leaf-a" aria-hidden="true"></div>
          <div class="scene-decor scene-decor--leaf-b" aria-hidden="true"></div>
          <div class="scene-decor scene-decor--leaf-c" aria-hidden="true"></div>
          <div class="scene-decor scene-decor--star-a" aria-hidden="true"></div>
          <div class="scene-decor scene-decor--star-b" aria-hidden="true"></div>
          <div class="scene-decor scene-decor--heart" aria-hidden="true"></div>

          <section class="hero-copy" aria-labelledby="hero-title-main">
            <div class="hero-tag">
              <img
                class="hero-tag__image js-fallback-image"
                src="image/03.webp"
                alt="Web3 农业生态实验标签"
                data-placeholder="assets/placeholder.svg"
                data-fallback-target=".hero-tag"
              />
            </div>

            <div class="hero-title-block">
              <img
                class="hero-title-image js-fallback-image"
                src="image/02.webp"
                alt="欢迎来到币安萌芽"
                data-placeholder="assets/placeholder.svg"
                data-fallback-target=".hero-title-block"
              />

              <h1 class="hero-title visually-hidden">
                <span id="hero-title-main" class="hero-title__top">欢迎来到</span>
                <span class="hero-title__bottom">币安萌芽</span>
              </h1>
            </div>

            <div class="hero-ribbon">
              <img
                class="hero-ribbon__image js-fallback-image"
                src="image/04.webp"
                alt="从一颗种子开始，建设长期生态价值"
                data-placeholder="assets/placeholder.svg"
                data-fallback-target=".hero-ribbon"
              />
              <span class="visually-hidden">从一颗种子开始，建设长期生态价值</span>
            </div>

            <p class="hero-description">
              结合 DeFi 经济模型、社区共建机制与农业成长叙事，<br />
              让每个人都能拥有一块数字土地，参与生态成长，共享长期价值。
            </p>

            <div class="feature-chips" aria-label="功能亮点">
              <span class="feature-chip">
                <span class="feature-chip__icon" aria-hidden="true">
                  <img
                    class="feature-chip__icon-image js-fallback-image"
                    src="image/09-转换自-png.webp"
                    alt=""
                    data-placeholder="assets/placeholder.svg"
                    data-fallback-target=".feature-chip__icon"
                  />
                </span>
                <span>开垦土地</span>
              </span>
              <span class="feature-chip">
                <span class="feature-chip__icon" aria-hidden="true">
                  <img
                    class="feature-chip__icon-image js-fallback-image"
                    src="image/10-转换自-png.webp"
                    alt=""
                    data-placeholder="assets/placeholder.svg"
                    data-fallback-target=".feature-chip__icon"
                  />
                </span>
                <span>种植作物</span>
              </span>
              <span class="feature-chip">
                <span class="feature-chip__icon" aria-hidden="true">
                  <img
                    class="feature-chip__icon-image js-fallback-image"
                    src="image/11-转换自-png.webp"
                    alt=""
                    data-placeholder="assets/placeholder.svg"
                    data-fallback-target=".feature-chip__icon"
                  />
                </span>
                <span>卖菜分红</span>
              </span>
              <span class="feature-chip">
                <span class="feature-chip__icon" aria-hidden="true">
                  <img
                    class="feature-chip__icon-image js-fallback-image"
                    src="image/12-转换自-png.webp"
                    alt=""
                    data-placeholder="assets/placeholder.svg"
                    data-fallback-target=".feature-chip__icon"
                  />
                </span>
                <span>幸运抽奖</span>
              </span>
            </div>

            <div class="hero-actions">
              <a class="primary-action" href="./app.html" style="text-decoration: none;">
                <span>立即开始</span>
              </a>

              <button class="secondary-action js-preview-image" type="button">
                <span>了解玩法</span>
                <span class="secondary-action__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M9 7.75v8.5l7-4.25-7-4.25Z" />
                  </svg>
                </span>
              </button>
            </div>
          </section>

          <section class="hero-art" aria-label="主角色插画区域">
            <div class="hero-art__glow" aria-hidden="true"></div>
            <div class="hero-art__frame">
              <img
                class="hero-art__image js-fallback-image"
                src="assets/hero-mascot.png"
                alt="币安萌芽主角色插画"
                data-placeholder="assets/placeholder.svg"
                data-fallback-target=".hero-art__frame"
              />
              <div class="hero-art__fallback">
                <span>主角色插画占位</span>
                <strong>hero-mascot.png</strong>
              </div>
            </div>
          </section>

          <section class="feature-cards" id="feature-cards" aria-label="功能卡片">
            <article class="feature-card">
              <div class="feature-card__media">
                <img
                  class="feature-card__image js-fallback-image"
                  src="image/05-转换自-png.webp"
                  alt="拥有土地卡片插画"
                  data-placeholder="assets/placeholder.svg"
                  data-fallback-target=".feature-card__media"
                />
              </div>
              <div class="feature-card__content">
                <h2>拥有土地</h2>
                <p>开启你的数字菜园</p>
                <span class="feature-card__accent" aria-hidden="true"></span>
              </div>
            </article>

            <article class="feature-card">
              <div class="feature-card__media">
                <img
                  class="feature-card__image js-fallback-image"
                  src="image/06-转换自-png.webp"
                  alt="种植成长卡片插画"
                  data-placeholder="assets/placeholder.svg"
                  data-fallback-target=".feature-card__media"
                />
              </div>
              <div class="feature-card__content">
                <h2>种植成长</h2>
                <p>播种、成熟、收获</p>
                <span class="feature-card__accent" aria-hidden="true"></span>
              </div>
            </article>

            <article class="feature-card">
              <div class="feature-card__media">
                <img
                  class="feature-card__image js-fallback-image"
                  src="image/07-转换自-png.webp"
                  alt="卖菜分红卡片插画"
                  data-placeholder="assets/placeholder.svg"
                  data-fallback-target=".feature-card__media"
                />
              </div>
              <div class="feature-card__content">
                <h2>卖菜分红</h2>
                <p>按比例参与周分红</p>
                <span class="feature-card__accent" aria-hidden="true"></span>
              </div>
            </article>

            <article class="feature-card">
              <div class="feature-card__media">
                <img
                  class="feature-card__image js-fallback-image"
                  src="image/08-转换自-png.webp"
                  alt="幸运玩法卡片插画"
                  data-placeholder="assets/placeholder.svg"
                  data-fallback-target=".feature-card__media"
                />
              </div>
              <div class="feature-card__content">
                <h2>幸运玩法</h2>
                <p>黄金玉米解锁抽奖</p>
                <span class="feature-card__accent" aria-hidden="true"></span>
              </div>
            </article>
          </section>
        </div>
      </main>
    </div>

    <!-- 玩法机制预览弹窗 -->
    <div class="image-preview-modal" id="rulePreviewModal" hidden>
      <div class="image-preview-backdrop js-preview-close"></div>
      <div class="image-preview-content">
        <button class="image-preview-close js-preview-close" aria-label="关闭">×</button>
        <div class="image-preview-scroll">
          <img src="机制全解图.png" alt="机制全解图" class="image-preview-img" />
        </div>
        <div class="image-preview-actions">
          <a href="机制全解图.png" download="机制全解图.png" class="image-preview-download">下载原图</a>
        </div>
      </div>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
