      <stop offset="0%" stop-color="#f6ffd9" />
      <stop offset="100%" stop-color="#d7f7a6" />
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4bc72b" />
      <stop offset="100%" stop-color="#259914" />
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="28" fill="url(#bg)" />
  <circle cx="360" cy="82" r="42" fill="#fff4a8" opacity="0.9" />
  <circle cx="98" cy="100" r="54" fill="#ffffff" opacity="0.58" />
  <rect x="44" y="236" width="392" height="76" rx="38" fill="#97df5b" opacity="0.85" />
